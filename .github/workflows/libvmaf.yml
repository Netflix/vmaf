name: libvmaf
on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  libvmaf-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc
            os: ubuntu-latest
            CC: ccache gcc
            CXX: ccache g++
          - name: linux-x86_64-gcc-9
            os: ubuntu-latest
            CC: ccache gcc-9
            CXX: ccache g++-9
          - name: linux-x86_64-clang
            os: ubuntu-latest
            CC: ccache clang
            CXX: ccache clang++
          - name: macos-clang
            os: macos-latest
            CC: ccache clang
            CXX: ccache clang++
            experimental: true
          - name: linux-arm64-clang
            os: ubuntu-24.04-arm
            CC: ccache clang
            CXX: ccache clang++
          - name: linux-i686-gcc
            os: ubuntu-latest
            CC: ccache gcc
            CXX: ccache g++
            CROSS: ./libvmaf/test/meson-toolchains/i686-pc-linux-gnu-gcc-cross.ini
          - name: linux-i686-clang
            os: ubuntu-latest
            CC: ccache clang
            CXX: ccache clang++
            CROSS: ./libvmaf/test/meson-toolchains/i686-pc-linux-gnu-clang-cross.ini
          - name: linux-x86_64-gcc-cuda
            os: ubuntu-latest
            CC: ccache gcc
            CXX: ccache g++
            enable_cuda: true
            enable_nvcc: true
          - name: linux-x86_64-clang-cuda
            os: ubuntu-latest
            CC: ccache clang-20
            CXX: ccache clang++-20
            enable_cuda: true
            enable_nvcc: false
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      CROSS: ${{ matrix.CROSS }}
    steps:
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11
      - name: Install meson and ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson

      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ccache ninja-build libomp-dev xxd
          case "$CC" in
          *gcc) sudo -E apt-get -yq install gcc g++ nasm ;;
          *gcc-9)
            sudo -E apt-add-repository -y "ppa:ubuntu-toolchain-r/test"
            sudo -E apt-get -yq install gcc-9 g++-9 nasm
            ;;
          *clang-20)
            # >=clang-20 is needed to support CUDA without nvcc
            sudo -E apt-get -yq install clang-20 llvm-20 nasm
            sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 200
            sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 200
            sudo update-alternatives --set clang /usr/bin/clang-20
            sudo update-alternatives --set clang++ /usr/bin/clang++-20
            which clang
            clang --version
            ;;
          *clang) sudo -E apt-get -yq install clang llvm nasm ;;
          esac
          if [ -n "$CROSS" ]; then
            sudo -E apt-get -yq install gcc-multilib g++-multilib
          fi
          $CC --version
          meson --version
          ccache --version

      - name: Install dependencies (mac)
        if: matrix.os == 'macos-latest'
        run: |
          brew install -q ninja nasm ccache llvm

          $CC --version
          meson --version
          ccache --version

      - name: Install CUDA toolkit
        if: matrix.enable_cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          # 12.8.2 is the latest version that clang20 supports without nvcc
          cuda: '12.8.2'
          method: network
          use-github-cache: false
          use-local-cache: false
          sub-packages: '["nvcc", "cudart", "cudart-dev"]'
          non-cuda-sub-packages: '["libcurand-dev"]'

      - name: Install nv-codec-headers
        if: matrix.enable_cuda
        run: |
          git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers.git
          sudo make -C nv-codec-headers install PREFIX=/usr/local

      - uses: actions/checkout@v7
      - name: Run meson
        run: |
          MESON_OPTS="--buildtype release --prefix $PWD/install -Denable_float=true"
          if [ "${{ matrix.enable_cuda }}" = "true" ]; then
            MESON_OPTS="$MESON_OPTS -Denable_cuda=true -Denable_nvcc=${{ matrix.enable_nvcc }}"
            BUILD_DIR="$RUNNER_TEMP/libvmaf_build"
          else
            BUILD_DIR="libvmaf/build"
          fi
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          meson setup libvmaf "$BUILD_DIR" $MESON_OPTS ${CROSS:+--cross-file $CROSS}

      - name: Run ninja
        run: |
          sudo ninja -vC "$BUILD_DIR" install

      - name: Run tests
        if: matrix.enable_cuda != true
        run: |
          sudo ninja -vC "$BUILD_DIR" test
      - name: Set up tox
        if: matrix.enable_cuda != true
        run: |
          mkdir -p ~/.ccache && sudo chown -R $(whoami) ~/.ccache
          pip install tox
      - name: Run tox tests (ubuntu)
        if: matrix.os == 'ubuntu-latest' && matrix.enable_cuda != true
        run: |
          tox -c python
      - name: Run tox tests (mac)
        if: matrix.os == 'macos-latest'
        run: |
          PATH=$(brew --prefix)/opt/llvm/bin:$PATH \
          CC=$(brew --prefix)/opt/llvm/bin/clang \
          CXX=$(brew --prefix)/opt/llvm/bin/clang++ \
          tox -c python

      - name: Get binary path & Current Release
        id: get_info
        run: |
          ldd "./install/bin/vmaf" || true
          echo "path=./install/bin/vmaf" >> $GITHUB_OUTPUT
          echo "upload_url=$(curl -L https://api.github.com/repos/${{ github.repository }}/releases/tags/$(cut -d/ -f3 <<< ${{ github.ref }}) | jq -r ."upload_url")" >> $GITHUB_OUTPUT

      - name: Package vmaf
        id: package
        run: |
          zip_path="vmaf-${{ matrix.name }}.zip"
          zip -j "$zip_path" "${{ steps.get_info.outputs.path }}"
          echo "zip_path=$zip_path" >> $GITHUB_OUTPUT

      - name: Upload vmaf
        uses: actions/upload-artifact@v7
        with:
          name: vmaf-${{ matrix.name }}
          path: ${{ steps.package.outputs.zip_path }}
      - name: Upload vmaf
        if: steps.get_info.outputs.upload_url != 'null'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_info.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.zip_path }}
          asset_name: ${{ steps.package.outputs.zip_path }}
          asset_content_type: application/zip

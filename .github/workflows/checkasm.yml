name: checkasm

on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  checkasm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build gcc g++
          if [ "${{ runner.arch }}" = "X64" ]; then
            sudo -E apt-get -yq install nasm
          fi
          python -m pip install --upgrade pip
          pip install meson

      - name: Configure
        run: |
          meson setup libvmaf libvmaf/build --buildtype release -Denable_checkasm=true

      - name: Build
        run: |
          ninja -vC libvmaf/build test/checkasm/checkasm

      - name: Run correctness checks
        run: |
          ./libvmaf/build/test/checkasm/checkasm --verbose

      - name: Run benchmarks
        run: |
          ./libvmaf/build/test/checkasm/checkasm --bench --json > /tmp/pr-bench.json
          {
            echo "### checkasm benchmark results (${{ matrix.name }})"
            echo '```'
            ./libvmaf/build/test/checkasm/checkasm --bench
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # Everything below compares this PR's benchmarks against its base
      # branch, built and run on this same runner so the comparison isn't
      # skewed by different hardware. It's best-effort: the base ref may not
      # have checkasm at all (e.g. the PR that first introduces it), in
      # which case these steps skip cleanly rather than failing the job.
      - name: Fetch base ref
        if: github.event_name == 'pull_request'
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Build baseline checkasm (base ref)
        id: baseline_build
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add /tmp/base-ref ${{ github.event.pull_request.base.sha }}
          meson setup /tmp/base-ref/libvmaf /tmp/base-build --buildtype release -Denable_checkasm=true
          ninja -vC /tmp/base-build test/checkasm/checkasm

      - name: Run baseline benchmarks
        id: baseline_bench
        if: github.event_name == 'pull_request' && steps.baseline_build.outcome == 'success'
        continue-on-error: true
        run: |
          /tmp/base-build/test/checkasm/checkasm --bench --json > /tmp/base-bench.json

      - name: Compare benchmarks to base ref
        if: github.event_name == 'pull_request' && steps.baseline_bench.outcome == 'success'
        run: |
          {
            echo "### checkasm benchmark comparison vs base ref (${{ matrix.name }})"
            python3 libvmaf/test/checkasm/bench_diff.py /tmp/base-bench.json /tmp/pr-bench.json
          } >> "$GITHUB_STEP_SUMMARY"
